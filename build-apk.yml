name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip the project
        run: unzip -q SolarMonitor.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Use the signing key if the secrets exist
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No signing secrets found, building with the debug key."
          fi

      - name: Unit tests
        continue-on-error: true
        working-directory: SolarMonitor
        run: gradle --no-daemon testDebugUnitTest

      - name: Build the APK
        working-directory: SolarMonitor
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease

      - name: Name the APK
        run: cp SolarMonitor/app/build/outputs/apk/release/app-release.apk SolarMonitor-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: solar-monitor
          path: SolarMonitor-${{ github.run_number }}.apk

      - name: Publish under Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" \
            "SolarMonitor-${{ github.run_number }}.apk" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Solar Monitor build ${{ github.run_number }}" \
            --notes "APK built from commit ${{ github.sha }}."
